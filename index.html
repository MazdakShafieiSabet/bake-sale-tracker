<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europagymnasium Bake Sale</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    color: #512B81;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

/* Background image — covers the full viewport */
.bg {
    position: fixed;
    inset: 0;
    z-index: 0;
}

.bg picture,
.bg img {
    width: 100%;
    height: 100%;
    display: block;
}

.bg img {
    object-fit: cover;
    object-position: center bottom; /* anchor crowd to bottom on both crops */
}

/* Content card sits above the background */
.wrapper {
    position: relative;
    z-index: 1;
    width: min(640px, 90vw);
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius: 14px;
    padding: 24px 28px;
}

.info {
    margin-bottom: 8px;
    font-size: clamp(16px, 3.5vw, 24px);
    font-weight: bold;
}

.progress-container {
    width: 100%;
    height: 35px;
    background: #9290C3;
    border-radius: 10px;
    border: 2px solid #512B81;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #512B81, #4477CE, #8CABFF);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    transition: width 0.4s ease;
}

.tagline {
    margin-top: 8px;
    font-size: 14px;
    color: #333;
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
    <picture>
        <!-- Portrait GIF on narrow screens (phones) -->
        <source
            media="(max-width: 767px)"
            srcset="img-mobile.gif"
        >
        <!-- Landscape GIF on wider screens (tablets, desktops) -->
        <img
            src="img-desktop.gif"
            alt=""
            fetchpriority="high"
        >
    </picture>
</div>

<div class="wrapper">
    <div class="info" id="infoText"></div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="tagline">
        <em>Initiative to support and defend democracy</em>
    </div>
</div>

<script>
    const currentValue = 0;
    const targetValue = 10000;

    const progressPercent = (currentValue / targetValue) * 100;

    document.getElementById("progressBar").style.width = progressPercent + "%";
    document.getElementById("infoText").textContent =
        `Bake Sale Money Target: €${currentValue.toLocaleString()} of €${targetValue.toLocaleString()}`;
</script>
</body>
</html>
