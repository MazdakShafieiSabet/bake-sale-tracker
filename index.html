<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark's Tracker</title>

<style>
body {
    font-family: Arial, sans-serif;
    color: whitesmoke;
    background: linear-gradient(
        to bottom right,
        #1B1A55,
        #070F2B
    );
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.wrapper {
    width: 640px;
}

.info {
    margin-bottom: 8px;
    font-size: 24px;
    font-weight: bold;
}

.progress-container {
    width: 100%;
    height: 35px;
    background: #9290C3;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(
        to right,
        #512B81,
        #4477CE,
        #8CABFF
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    transition: width 0.4s ease;
}
</style>
</head>
<body>

<div class="wrapper">
    <div class="info" id="infoText"></div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<script>
    // Hard-coded values
    const currentValue = 0;
    const targetValue = 10000;
    
    // Calculate percentage internally
    const progressPercent = (currentValue / targetValue) * 100;
    
    const progressBar = document.getElementById("progressBar");
    const infoText = document.getElementById("infoText");
    
    // Update UI
    progressBar.style.width = progressPercent + "%";
    
    infoText.textContent = `Bake Sale Money Target: €${currentValue.toLocaleString()} of €${targetValue.toLocaleString()}`;
</script>

</body>
</html>
